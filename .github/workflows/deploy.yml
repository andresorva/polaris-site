name: Deploy POLARIS Frontend
on:
  push:
    branches: [main, rebuild-frontend-v2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      # NOTE: --if-present must NOT go here — after `--` it reaches vitest,
      # which errors `Unknown option --ifPresent` and fails the step on EVERY
      # run (this silently blocked all deploys since 2026-05-18). The `test`
      # script always exists, so the guard is unnecessary anyway.
      - run: npm test -- --run
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://web-production-d6505.up.railway.app
          # Demo gate credentials. Vite inlines VITE_* at build time; if these
          # are absent the validator dead-code-eliminates to `return false` and
          # nobody can log in (the 2026-05-18 prod build shipped this bug).
          # These are non-secret demo creds (already readable in the client
          # bundle by design). Override via repo Secrets if desired.
          VITE_DEMO_USER_1: ${{ secrets.VITE_DEMO_USER_1 || 'andresorva' }}
          VITE_DEMO_USER_2: ${{ secrets.VITE_DEMO_USER_2 || 'luisphr' }}
          VITE_DEMO_PASSWORD: ${{ secrets.VITE_DEMO_PASSWORD || 'PolarisTest' }}
      # GitHub Pages has no SPA fallback: unknown paths 404. Serving a copy of
      # index.html as 404.html makes deep-links/refresh on app routes load the
      # SPA (standard GH Pages + BrowserRouter workaround).
      - run: cp dist/index.html dist/404.html
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
