name: Deploy POLARIS Frontend
on:
  push:
    branches: [main, rebuild-frontend-v2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      # NOTE: --if-present must NOT go here — after `--` it reaches vitest,
      # which errors `Unknown option --ifPresent` and fails the step on EVERY
      # run (this silently blocked all deploys since 2026-05-18). The `test`
      # script always exists, so the guard is unnecessary anyway.
      - run: npm test -- --run
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://web-production-d6505.up.railway.app
          # Demo gate credentials. Vite inlines VITE_* at build time; if these
          # are absent the validator dead-code-eliminates to `return false` and
          # nobody can log in (the 2026-05-18 prod build shipped this bug).
          # These come ONLY from repo Secrets — no cleartext fallback is
          # versioned here. If a secret is unset the value is empty (login
          # disabled), never the real credential. Set the GitHub repo Secrets
          # VITE_DEMO_USER_1 / VITE_DEMO_USER_2 / VITE_DEMO_PASSWORD to enable.
          VITE_DEMO_USER_1: ${{ secrets.VITE_DEMO_USER_1 }}
          VITE_DEMO_USER_2: ${{ secrets.VITE_DEMO_USER_2 }}
          VITE_DEMO_PASSWORD: ${{ secrets.VITE_DEMO_PASSWORD }}
          # Sentry DSN. initSentry() no-ops when this is empty (if (!dsn) return),
          # so an unset secret is safe: the build succeeds and Sentry stays inert.
          # Set the VITE_SENTRY_DSN repo Secret to activate error reporting.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN || '' }}
      # CNAME (polaris.datanaat.com) lives in public/ so Vite copies it verbatim
      # into dist/, ensuring the custom domain travels in the Pages artifact.
      # Without this, deploy-pages reset the domain on every run.
      # GitHub Pages has no SPA fallback: unknown paths 404. Serving a copy of
      # index.html as 404.html makes deep-links/refresh on app routes load the
      # SPA (standard GH Pages + BrowserRouter workaround).
      - run: cp dist/index.html dist/404.html
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
