<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>POLARIS · Plataforma de Inteligencia Política</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
      <rect width="600" height="400" fill="#0A0E1A"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2EE6C8"/><stop offset="100%" stop-color="#4D7CFF"/></linearGradient></defs>
      <path d="M300 100 L330 200 L420 220 L330 240 L300 340 L270 240 L180 220 L270 200 Z" fill="url(#g)"/>
      <circle cx="300" cy="220" r="22" fill="#0A0E1A"/>
      <circle cx="300" cy="220" r="9" fill="#2EE6C8"/>
    </svg>
  </template>
</head>
<body>
  <!-- Global atmosphere (datanaat-style): grid + mesh blobs + cursor halo -->
  <div class="atmos-grid" aria-hidden="true"></div>
  <div class="atmos-mesh" aria-hidden="true"><span></span></div>
  <div class="atmos-cursor" id="atmosCursor" aria-hidden="true"></div>

  <div id="root"></div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Markdown parser para Daily Brief (Día 5 Ronda 3) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js" integrity="sha384-VvA5gLRbLvSx8K1dGXC55TbdIzD1Og9LScxXPbdcHHyeXcQUM7TcfZxdaY+5DQXl" crossorigin="anonymous"></script>

  <!-- Config + data layer (orden importa: config → mock → api-client → data) -->
  <script src="config.js"></script>
  <script src="data-mock.js"></script>
  <script src="api-client.js"></script>
  <script src="data.js"></script>

  <!-- Components and screens (Babel JSX) -->
  <script type="text/babel" src="components-shared.jsx"></script>
  <!-- Día 3 Parte 2: componentes nuevos del dashboard premium -->
  <script type="text/babel" src="granularity-toggle.jsx"></script>
  <script type="text/babel" src="freshness-indicator.jsx"></script>
  <script type="text/babel" src="crisis-banner.jsx"></script>
  <script type="text/babel" src="topic-cloud.jsx"></script>
  <script type="text/babel" src="coordination-graph.jsx"></script>
  <!-- Pantallas y tabs -->
  <script type="text/babel" src="screen-landing.jsx"></script>
  <script type="text/babel" src="screen-login.jsx"></script>
  <script type="text/babel" src="screen-politicians.jsx"></script>
  <script type="text/babel" src="tab-overview.jsx"></script>
  <script type="text/babel" src="tab-sentiment-mentions-critics.jsx"></script>
  <script type="text/babel" src="tab-alerts-reports-sources.jsx"></script>
  <script type="text/babel" src="tab-daily-brief.jsx"></script>
  <script type="text/babel" src="tab-strategist.jsx"></script>
  <script type="text/babel" src="agents-modal.jsx"></script>
  <script type="text/babel" src="screen-dashboard-shell.jsx"></script>

  <!-- App root -->
  <script type="text/babel">
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, info) {
        if (window.console && console.error) {
          console.error('[ErrorBoundary]', error, info);
        }
      }
      render() {
        if (this.state.hasError) {
          return React.createElement('div', {
            className: 'card glass',
            style: { padding: 32, margin: 24, textAlign: 'center' }
          },
            React.createElement('div', { className: 'eyebrow', style: { marginBottom: 8, color: 'var(--neg)' } }, '⚠ ERROR'),
            React.createElement('div', { className: 'display', style: { fontSize: 20, marginBottom: 12 } }, 'Algo salió mal en este componente'),
            React.createElement('div', { className: 'muted', style: { marginBottom: 16 } }, 'Recarga la página o vuelve al selector de políticos.'),
            React.createElement('button', {
              className: 'btn btn-primary',
              onClick: () => window.location.reload()
            }, 'Recargar')
          );
        }
        return this.props.children;
      }
    }
    window.ErrorBoundary = ErrorBoundary;

    function isSessionValid() {
      try {
        const raw = localStorage.getItem('polaris_session');
        if (!raw) return false;
        const s = JSON.parse(raw);
        return !!(s && typeof s.user === 'string' && ['andresorva', 'luisphr'].includes(s.user));
      } catch {
        return false;
      }
    }

    function App() {
      const [screen, setScreen] = React.useState(isSessionValid() ? 'politicians' : 'landing');
      const [politician, setPolitician] = React.useState(POLITICIANS[0]);

      const Page = {
        landing: LandingPage,
        login: LoginScreen,
        politicians: PoliticiansScreen,
        dashboard: DashboardScreen,
      }[screen];

      return (
        <Page
          onNavigate={setScreen}
          onSelectPolitician={setPolitician}
          politician={politician}
        />
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);

    // Global cursor glow — smoothed RAF tracking
    (function () {
      const glow = document.getElementById('atmosCursor');
      if (!glow) return;
      let tx = window.innerWidth / 2, ty = window.innerHeight / 2;
      let cx = tx, cy = ty;
      let raf = null;
      const tick = () => {
        cx += (tx - cx) * 0.12;
        cy += (ty - cy) * 0.12;
        glow.style.transform = 'translate(' + (cx - 300) + 'px,' + (cy - 300) + 'px)';
        glow.style.left = '0';
        glow.style.top = '0';
        if (Math.abs(tx - cx) > 0.3 || Math.abs(ty - cy) > 0.3) {
          raf = requestAnimationFrame(tick);
        } else {
          raf = null;
        }
      };
      window.addEventListener('pointermove', (e) => {
        tx = e.clientX; ty = e.clientY;
        if (!raf) raf = requestAnimationFrame(tick);
      }, { passive: true });
      window.addEventListener('pointerleave', () => { glow.style.opacity = '0.4'; });
      window.addEventListener('pointerenter', () => { glow.style.opacity = '1'; });
    })();
  </script>
</body>
</html>
